services:
  database:
    image: postgres:17-alpine
    container_name: pr-office-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: pr_office
      POSTGRES_USER: pr_office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pr-office-local-password}
    volumes:
      - pr-office-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_office -d pr_office"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pr-office-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://pr_office:${POSTGRES_PASSWORD:-pr-office-local-password}@database:5432/pr_office
      SERVE_STATIC: "false"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pr-office-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8090:80"

volumes:
  pr-office-database:
